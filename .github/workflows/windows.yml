name: Windows

# Builds the Windows 11 installer (.exe, NSIS) and a .zip of the same folder, then checks that the packed app starts on
# its own and that the installer installs it. Artifacts: deepwater-windows (packages), smoke-windows (screenshot, log).
# Run by the release workflow (release.yml, on a version tag) and by hand; not on every push to main, where the day's
# work is built on macOS (2026-11-21: ci/windows was merged into main).
on:
  workflow_call:
  workflow_dispatch:

jobs:
  windows:
    name: Windows 11 (.exe)
    runs-on: windows-2025   # the same base as Windows 11 24H2
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.12.0   # the version the app is built with on macOS; the app does not use Qt WebEngine
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qthttpserver qtwebsockets qtpdf qtwebview   # qtpdf: Bank Research's PDF pages; qtwebview: the Squawk player (WebView2)
          cache: true
          # Qt 6.11+ splits its Windows repository by compiler, which aqtinstall 3.3.0 (the last release on PyPI)
          # can't read; aqtinstall's master has the fix (PR #1000). Back to the default once 3.4 is out.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7

      - name: NSIS and Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
          if (Test-Path "${env:ProgramFiles(x86)}\NSIS") { "${env:ProgramFiles(x86)}\NSIS" | Out-File $env:GITHUB_PATH -Append -Encoding utf8 }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      # The x64 MSVC environment (what the "x64 Native Tools Command Prompt" sets) for the next steps.
      - name: MSVC environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
                -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      # A cache of compilations: a run only recompiles what changed.
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Use the cache
        shell: pwsh
        run: '"SCCACHE_GHA_ENABLED=true" | Out-File $env:GITHUB_ENV -Append -Encoding utf8'

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      # Ninja with -k 0 compiles every file even after errors, so one run shows them all.
      - name: Build
        run: cmake --build build -- -k 0

      - name: Package
        id: package
        run: cmake --build build --target dist

      - uses: actions/upload-artifact@v4
        with:
          name: deepwater-windows
          path: |
            build/dist/*.exe
            build/dist/*.zip
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      # The packed folder must run on its own: Qt off the PATH, no Qt variables, a fresh profile; it opens the Overview,
      # takes a screenshot and quits.
      - name: Smoke test
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          # The .zip a user would download, unpacked: the same folder the installer puts under Program Files.
          $zip = (Get-ChildItem build/dist/*.zip | Select-Object -First 1).FullName
          Expand-Archive $zip -DestinationPath smoke-app -Force
          $dir = (Get-ChildItem smoke-app -Directory | Select-Object -First 1).FullName
          Get-ChildItem $dir | Format-Table -AutoSize Mode, Length, Name | Out-String -Width 200
          foreach ($f in 'Deepwater.exe', 'Qt6Core.dll', 'Qt6HttpServer.dll', 'Qt6WebSockets.dll', 'Qt6Pdf.dll', 'Qt6PrintSupport.dll', 'Qt6WebView.dll', 'qt.conf', 'msvcp140.dll') {
            if (-not (Test-Path "$dir\$f")) { throw "$f isn't at the top of the packed folder" }
          }
          # the Squawk player's backend is a plugin: windeployqt must have brought it
          $wv = Get-ChildItem $dir -Recurse -Filter 'qtwebview_webview2.dll' | Select-Object -First 1
          if (-not $wv) { throw "the WebView2 plugin (qtwebview_webview2.dll) isn't in the packed folder" }
          "WebView2 plugin: $($wv.FullName.Substring($dir.Length))"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH, Env:QT_ROOT_DIR -ErrorAction SilentlyContinue
          New-Item -ItemType Directory smoke -Force | Out-Null
          $env:DW_PROFILE = "$PWD\smoke\profile"
          $env:DW_CACHE_DIR = "$PWD\smoke\cache"
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $shot = "$PWD\smoke\smoke-windows.png"
          $log = "$PWD\smoke\smoke-windows.log"
          $p = Start-Process "$dir\Deepwater.exe" -PassThru -RedirectStandardError $log -ArgumentList `
               '--page', 'global/overview', '--size', '1600x1000', '--delay', '25000', '--screenshot', "`"$shot`""
          $null = $p.Handle   # without it, ExitCode stays empty after WaitForExit
          if (-not $p.WaitForExit(180000)) {
            $p.Kill()
            "--- its log"; Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 80
            throw "Deepwater.exe didn't exit within 3 minutes"
          }
          "--- its log"; Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 80
          if ($p.ExitCode -ne 0) { throw "Deepwater.exe exited with code $($p.ExitCode)" }
          if (-not (Test-Path $shot)) { throw "no screenshot" }
          "Screenshot: $((Get-Item $shot).Length) bytes"

          # Windows' own engines behind Bank Research's PDF reader and the RBA / RBNZ OCR (app/SelfTest.h)
          $st = "$PWD\smoke\selftest.json"
          $stlog = "$PWD\smoke\selftest.log"
          $q = Start-Process "$dir\Deepwater.exe" -PassThru -RedirectStandardError $stlog -ArgumentList '--selftest', "`"$st`""
          $null = $q.Handle
          if (-not $q.WaitForExit(120000)) { $q.Kill(); throw "--selftest didn't exit within 2 minutes" }
          "--- selftest"; Get-Content $stlog -ErrorAction SilentlyContinue | Select-Object -Last 20
          if (Test-Path $st) { Get-Content $st }
          if ($q.ExitCode -ne 0) { throw "--selftest failed (exit code $($q.ExitCode))" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows
          path: |
            smoke/*.png
            smoke/*.log
            smoke/*.json
          retention-days: 14
          if-no-files-found: ignore

      # What a user does: run the installer (silently here), then find the app where it put it.
      - name: The installer installs
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $exe = (Get-ChildItem build/dist/*.exe | Select-Object -First 1).FullName
          "Installer: $exe, $([math]::Round((Get-Item $exe).Length / 1MB)) MB"
          $i = Start-Process $exe -ArgumentList '/S' -Wait -PassThru
          if ($i.ExitCode -ne 0) { throw "the installer exited with code $($i.ExitCode)" }
          # its own folder: Program Files\Deepwater Mark 4, never Program Files\Deepwater (the original's)
          $home_ = Get-Item "$env:ProgramFiles\Deepwater Mark 4" -ErrorAction SilentlyContinue
          if (-not $home_) { throw "nothing installed in Program Files\Deepwater Mark 4" }
          if (Test-Path "$env:ProgramFiles\Deepwater") { throw "something was installed in Program Files\Deepwater" }
          "Installed in $($home_.FullName)"
          Get-ChildItem $home_.FullName | Format-Table -AutoSize Mode, Length, Name | Out-String -Width 200
          foreach ($f in 'Deepwater.exe', 'Qt6Core.dll', 'Uninstall.exe') {
            if (-not (Test-Path "$($home_.FullName)\$f")) { throw "$f wasn't installed" }
          }
